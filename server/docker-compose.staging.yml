version: '3.9'
services:
  db-staging:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayurcalm_staging
      POSTGRES_PASSWORD: ${STAGING_DB_PASSWORD:-staging_password_change_me}
      POSTGRES_DB: ayurcalm_staging
    ports:
      - "5434:5432"
    volumes:
      - db-staging-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ayurcalm_staging -d ayurcalm_staging"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - staging

  api-staging:
    build:
      context: .
      dockerfile: Dockerfile.staging
    restart: unless-stopped
    depends_on:
      db-staging:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ayurcalm_staging:${STAGING_DB_PASSWORD:-staging_password_change_me}@db-staging:5432/ayurcalm_staging?schema=public
      NODE_ENV: staging
      PORT: 4001
    ports:
      - "4001:4001"
    volumes:
      - ./server/backups/stg:/app/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - staging

  ui-staging:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api-staging
    ports:
      - "4174:80"
    volumes:
      - ./staging-ui-build:/usr/share/nginx/html:ro
      - ./nginx-staging.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - staging

networks:
  staging:
    driver: bridge

volumes:
  db-staging-data: