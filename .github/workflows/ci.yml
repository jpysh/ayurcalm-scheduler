name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Every pull request: builds and the tests that need no database. Minutes, not
  # the full stack, so a day sheet styling change is not held up.
  fast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      # Non-blocking: the codebase carries ~470 pre-existing no-explicit-any
      # errors. Reported so the count goes down over time, not up, without
      # failing every PR until they are cleared.
      - run: npm run lint
        continue-on-error: true
      - run: npm run build
      - run: npm ci
        working-directory: server
      - run: npx prisma generate
        working-directory: server
      - run: npm run build
        working-directory: server
      # Diet resolution, PDF word shortening, availability and the rota: pure
      # functions, no database.
      - run: npm test
        working-directory: server
      # Trial sign-up limits and lifecycle on a fake clock (#247).
      - run: node provisioner/test.mjs

  # Does this change reach the server? Merges to main always count.
  scope:
    runs-on: ubuntu-latest
    outputs:
      full: ${{ steps.check.outputs.full }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: check
        run: |
          if [ "${{ github.event_name }}" = push ] \
            || git diff --name-only ${{ github.event.pull_request.base.sha }} HEAD \
               | grep -qE '^(server/|tests/e2e/|src/pages/SetupWizard\.tsx|Dockerfile|docker-compose\.yml|docker-entrypoint\.sh|scripts/qa\.sh|\.github/)'; then
            echo full=true >> "$GITHUB_OUTPUT"
          else
            echo full=false >> "$GITHUB_OUTPUT"
          fi

  # The real quick start, seeded with demo data, then every server test and the
  # browser walk against it. A change to the scheduler or the planner must not
  # merge without this.
  full:
    needs: scope
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # qa walks one path in a browser, so Chromium goes in first.
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Server, planner or Docker changes: the same command the maintainer runs
      # locally, every server test inside the app container.
      - if: needs.scope.outputs.full == 'true'
        run: npm run qa
      # A screen-only change: just the stack, for the smoke set.
      - if: needs.scope.outputs.full != 'true'
        run: |
          RATE_LIMIT_WRITES=1000 docker compose up -d --build --wait
          # Healthy is not seeded: the first start still fills the demo data.
          until curl -sf http://localhost:8080/api/health >/dev/null; do sleep 3; done
      # The smoke set is the only browser gate (#315), on every PR. Everything else
      # runs nightly (nightly.yml) and blocks nothing. qa already ran the
      # therapist-off walk, and a second run would press on the API's write limit.
      - run: npx playwright test --grep @smoke --grep-invert "${{ needs.scope.outputs.full == 'true' && 'a therapist off' || 'zzz-none' }}"
      # A centre moves self-host -> cloud -> self-host in one file (#231).
      - if: needs.scope.outputs.full == 'true'
        run: sh scripts/move-test.sh
      - if: failure()
        run: docker compose logs app | tail -100
