name: Nightly browser tests

# Everything the PR gate does not run (#315). Advisory: nobody is blocked. A red
# run files or updates one issue; one weekly "test repair" PR clears it.
on:
  schedule:
    - cron: '30 21 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: ALLOW_DEMO_PASSWORD=true RATE_LIMIT_WRITES=1000 docker compose up -d --build --wait
      # --wait returns when the container is healthy; the first seed can still be running.
      - run: until curl -sf http://localhost:8080/api/health >/dev/null; do sleep 3; done
      - id: run
        continue-on-error: true
        run: npx playwright test --grep-invert @smoke --reporter=line 2>&1 | sed 's/\x1b\[[0-9;]*[A-Za-z]//g' | tee nightly.log
        shell: bash
      - name: File or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          fails=$(grep -E '^\s+[0-9]+\) ' nightly.log | sort -u | head -60 || true)
          taps=$(sed -n '/^Tap count at/,/^$/p' nightly.log | head -40)
          n=$(gh issue list --state open --search '"Nightly browser tests" in:title' --json number -q '.[0].number')
          if [ -z "$fails" ]; then
            [ -n "$n" ] && gh issue comment "$n" --body "Green on $(date +%F). Closing." && gh issue close "$n"
            exit 0
          fi
          # The same failures as last night add nothing: one comment per change, so the issue reads as a short history.
          sig=$(printf '%s' "$fails" | sed -E 's/^\s+[0-9]+\) //' | sort | sha1sum | cut -c1-12)
          if [ -n "$n" ] && gh issue view "$n" --json body,comments -q '.body, .comments[].body' | grep -o 'sig:[0-9a-f]*' | tail -1 | grep -qx "sig:$sig"; then echo "Same failures as before; no comment."; exit 0; fi
          body=$(printf 'Failing on %s ([run](%s/%s/actions/runs/%s)):\n\n```\n%s\n```\n\nTap-count report:\n\n```\n%s\n```\n<!-- sig:%s -->\n' "$(date +%F)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$fails" "$taps" "$sig")
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"
          else gh issue create --title "Nightly browser tests" --body "$body"; fi
