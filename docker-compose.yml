# Full stack: Postgres plus one app container serving the API and the UI.
# Configure via .env — you should not need to edit this file.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ayurcalm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayurcalm}
      POSTGRES_DB: ${POSTGRES_DB:-ayurcalm}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ayurcalm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ayurcalm}:${POSTGRES_PASSWORD:-ayurcalm}@db:5432/${POSTGRES_DB:-ayurcalm}?schema=public
      JWT_SECRET: ${JWT_SECRET:-}
      CENTRE_NAME: ${CENTRE_NAME:-Wellness Centre}
      NODE_ENV: production
    ports:
      - "${APP_PORT:-8080}:4000"

volumes:
  db-data:
