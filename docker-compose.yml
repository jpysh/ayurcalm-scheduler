# Full stack: Postgres plus one app container serving the API and the UI.
# Configure via .env — you should not need to edit this file.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ayurcalm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ayurcalm}
      POSTGRES_DB: ${POSTGRES_DB:-ayurcalm}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ayurcalm}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Nightly database backups into ./backups (#236); restore is in the README.
  backup:
    image: postgres:16
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGUSER: ${POSTGRES_USER:-ayurcalm}
      PGPASSWORD: ${POSTGRES_PASSWORD:-ayurcalm}
      PGDATABASE: ${POSTGRES_DB:-ayurcalm}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
      - ./scripts/backup-loop.sh:/backup-loop.sh:ro
    entrypoint: ["sh", "/backup-loop.sh"]

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-ayurcalm}:${POSTGRES_PASSWORD:-ayurcalm}@db:5432/${POSTGRES_DB:-ayurcalm}?schema=public
      JWT_SECRET: ${JWT_SECRET:-}
      CENTRE_NAME: ${CENTRE_NAME:-Wellness Centre}
      DEFAULT_SUPPORT_WHATSAPP: ${DEFAULT_SUPPORT_WHATSAPP:-420777558262}
      # Unset in a real install. Raises how many treatments the demo seed books
      # per room per day, for checking the app at a size no demo install has.
      SEED_TREATMENTS_PER_ROOM: ${SEED_TREATMENTS_PER_ROOM:-}
      # Set to true only when Cloudflare is in front, so the rate limiter can
      # trust its cf-connecting-ip header.
      BEHIND_CLOUDFLARE: ${BEHIND_CLOUDFLARE:-}
      # Writes per address in 5 minutes. Unset in a real install (40); qa raises it.
      RATE_LIMIT_WRITES: ${RATE_LIMIT_WRITES:-}
      RATE_LIMIT_CALLS: ${RATE_LIMIT_CALLS:-}
      NODE_ENV: production
    volumes:
      # Read-only: Settings shows the last backup and offers it for download.
      - ${BACKUP_DIR:-./backups}:/backups:ro
    ports:
      - "${APP_PORT:-8080}:4000"

volumes:
  db-data:
